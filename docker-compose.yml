version: "3.8"

services:
  reroute-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reroute_edge_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./backend/ewaste_system.db:/app/ewaste_system.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
